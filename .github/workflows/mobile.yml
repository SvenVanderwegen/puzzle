name: Mobile app

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'resources/js/lib/burnfront-engine.js'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'resources/js/lib/burnfront-engine.js'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
