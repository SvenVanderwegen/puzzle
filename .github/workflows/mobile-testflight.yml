name: Mobile app to TestFlight

# Builds the iPhone app on Expo's servers (EAS Build) and sends it to
# TestFlight (EAS Submit). Start it by hand: Actions > "Mobile app to
# TestFlight" > Run workflow. The secrets it needs are listed in
# apps/mobile/README.md under "Build from GitHub".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # INDIVIDUAL for a personal developer account, COMPANY_OR_ORGANIZATION for a company one.
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Check the secrets are set
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=""
          for name in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID ASC_APP_ID ASC_API_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see apps/mobile/README.md, 'Build from GitHub')"
            exit 1
          fi
        working-directory: .

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Run the checks first
        run: |
          npm run typecheck
          npm test

      - name: Write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          echo "EXPO_ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Link the Expo project
        # Finds the project on your Expo account by its slug, or creates it.
        run: eas init --non-interactive --force

      - name: Point submit at the App Store Connect app
        run: |
          jq --arg id "$ASC_APP_ID" --arg key "$EXPO_ASC_API_KEY_PATH" \
             --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" \
             '.submit.production.ios = {ascAppId: $id, ascApiKeyPath: $key, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss}' \
             eas.json > eas.tmp.json && mv eas.tmp.json eas.json

      - name: Build and send to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait
